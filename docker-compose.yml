version: '3'

services:
  dev:
    image: node:lts-alpine
    working_dir: /application
    volumes:
      - ./:/application:delegated
    command: /bin/sh -c "npm install && npm run dev"
    ports:
      - "3000:3000"
    networks:
      - net

  webserver:
    build:
      context: ./
      dockerfile: ./docker/node/Dockerfile
    volumes:
      - ./docker/webserver/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    environment:
      - VIRTUAL_HOST=andrew-inventory-book.innovationowl.com
      - LETSENCRYPT_HOST=andrew-inventory-book.innovationowl.com
      - ENABLE_ACME=true
    networks:
      expose_network:
      net:
    restart: always

networks:
  # Join proxy network for exposing http services
  expose_network:
    external:
      name: web_proxy
  net: