services:
  dev:
    image: node:lts-alpine
    working_dir: /app
    volumes:
      - ./:/app:delegated
      - inventory_book_node_modules:/app/node_modules
    command: /bin/sh -c "npm install && npm run db:generate && npm run dev -- --hostname 0.0.0.0 --port 3000"
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      # Reach MariaDB on the Docker host (override in .env for remote DBs)
      DATABASE_HOST: ${DATABASE_HOST:-host.docker.internal}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - net

  webserver:
    build:
      context: ./
      dockerfile: ./docker/node/Dockerfile
    env_file:
      - .env
    environment:
      - VIRTUAL_HOST=andrew-inventory-book.innovationowl.com
      - LETSENCRYPT_HOST=andrew-inventory-book.innovationowl.com
      - ENABLE_ACME=true
      # nginx-proxy / acme companion route to the Next.js server
      - VIRTUAL_PORT=3000
      - DATABASE_HOST=${DATABASE_HOST:-host.docker.internal}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      expose_network:
      net:
    restart: always

networks:
  # Join proxy network for exposing http services
  expose_network:
    name: web_proxy
    external: true
  net:

volumes:
  inventory_book_node_modules:
